<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Barang - Ursula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-md navbar-dark navbar-ursula">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Ursula</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuUtama" aria-controls="menuUtama"
                    aria-expanded="false" aria-label="Buka menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuUtama">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="daftar-barang.html">Daftar Barang</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah-barang.html">Tambah Barang</a></li>
                    <li class="nav-item"><a class="nav-link" href="detail-barang.html">Detail Barang</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-3">
            <div>
                <h1 class="h3 mb-1">Daftar Barang</h1>
                <p class="text-secondary mb-0">Barang yang tersedia di toko.</p>
            </div>
            <a class="btn btn-primary" href="tambah-barang.html">+ Tambah Barang Baru</a>
        </div>

        <div class="mb-3">
            <label for="cari-barang" class="form-label visually-hidden">Cari barang</label>
            <input type="search" id="cari-barang" class="form-control" placeholder="Cari nama barang...">
        </div>

        <div id="pesan-error" class="alert alert-danger d-none d-flex justify-content-between align-items-center" role="alert">
            <span>Gagal memuat data barang. Periksa koneksi internet.</span>
            <button id="btn-muat-ulang" type="button" class="btn btn-sm btn-outline-danger">Coba lagi</button>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <caption class="px-3">Data barang yang tersedia di toko Ursula</caption>
                    <thead>
                        <tr>
                            <th scope="col">No.</th>
                            <th scope="col">Nama Barang</th>
                            <th scope="col">Harga</th>
                            <th scope="col">Stok</th>
                            <th scope="col">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-barang"></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container text-center text-secondary small">Ursula - Aplikasi Kasir</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/daftar.js"></script>
</body>
</html>
