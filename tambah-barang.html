<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Barang - Ursula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-md navbar-dark navbar-ursula">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Ursula</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuUtama" aria-controls="menuUtama"
                    aria-expanded="false" aria-label="Buka menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuUtama">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="daftar-barang.html">Daftar Barang</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah-barang.html">Tambah Barang</a></li>
                    <li class="nav-item"><a class="nav-link" href="detail-barang.html">Detail Barang</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3">Form Tambah Barang</h1>
                        <p class="text-secondary">Isi formulir berikut untuk memasukkan data barang baru.</p>

                        <div id="alert-area"></div>

                        <form id="form-tambah" action="#" method="post" class="row g-3">
                            <div class="col-12">
                                <label for="nama-barang" class="form-label">Nama Barang</label>
                                <input type="text" class="form-control" id="nama-barang" name="nama-barang"
                                       placeholder="Masukkan nama barang" required>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="harga" class="form-label">Harga Barang (Rp)</label>
                                <input type="number" class="form-control" id="harga" name="harga" min="0"
                                       placeholder="Masukkan harga barang" required>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="stok" class="form-label">Jumlah Stok</label>
                                <input type="number" class="form-control" id="stok" name="stok" min="0"
                                       placeholder="Masukkan jumlah stok" required>
                            </div>

                            <div class="col-12">
                                <label for="kategori" class="form-label">Kategori Barang</label>
                                <select class="form-select" id="kategori" name="kategori" required>
                                    <option value="">-- Pilih Kategori --</option>
                                    <option value="alat-tulis">Alat Tulis</option>
                                    <option value="buku">Buku</option>
                                    <option value="lainnya">Lainnya</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="deskripsi" class="form-label">Deskripsi Barang</label>
                                <textarea class="form-control" id="deskripsi" name="deskripsi" rows="4"
                                          placeholder="Masukkan deskripsi barang"></textarea>
                            </div>

                            <div class="col-12 d-flex flex-column flex-sm-row gap-2">
                                <button type="submit" id="btn-simpan" class="btn btn-primary">Simpan Barang</button>
                                <button type="reset" class="btn btn-secondary">Kosongkan Form</button>
                                <a class="btn btn-link ms-sm-auto" href="daftar-barang.html">Kembali ke Daftar Barang</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container text-center text-secondary small">Ursula - Aplikasi Kasir</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/tambah.js"></script>
</body>
</html>
